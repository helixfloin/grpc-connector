syntax = "proto3";

package helixflo.example.grpc;

option java_package = "helixflo.example.grpc";
option java_outer_classname = "GreeterProto";
option java_multiple_files = true;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
